name: Java CI/CD Pipeline
 
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
 
jobs:
  build-and-test:
    name: Build, Unit Test & SonarQube Analysis
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
 
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
 
      - name: Build with Maven & Run JUnit Tests
        run: mvn -B clean verify
 
      - name: Run SonarQube Security Scan
        run: mvn sonar:sonar -Dsonar.projectKey=order-fulfillment-service
 
  deploy:
    name: Deploy to Kubernetes
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Azure Kubernetes Service (AKS)
        run: echo "Deploying container image to AKS production cluster..."
